name: Documentation CI

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs-app/**'
      - 'scripts/check-docs.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
      - '.node-version'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs-app/**'
      - 'scripts/check-docs.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
      - '.node-version'
      - '.github/workflows/docs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check documentation metadata and links
        run: npm run check:docs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Export static documentation
        run: npm run build:docs
      - name: Check required export files
        run: |
          test -s apps/docs-app/out/index.html
          test -s apps/docs-app/out/product/vision/index.html
          test -s apps/docs-app/out/operations/index.html
          test -s apps/docs-app/out/search-index.json
